name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: json, openssl, gd, zip, curl, pdo, pdo_mysql
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax
        run: |
          set -euo pipefail
          find app kernel -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          tail -n 5 /tmp/php-lint.txt

  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - php
    if: always()
    steps:
      - name: Verify every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "A required job did not succeed." >&2
              exit 1
            fi
          done
